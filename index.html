<script>
  'use strict';
  const WORKOUTS=JSON.parse(document.getElementById('workout-data').textContent);
  const STORAGE_KEY='gym_all_in_one_v3',DRAFT_KEY='entreno_draft_v1',SYNC_KEY='entreno_sync_pending_v1';
  const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzfTo_sfND3O3B3dnh0k7pPYEsWFn7RuVeMP16bshqf7-e9CeF5YhpY9dj3wWOm2SXyfQ/exec';
  const TYPE={push:{name:'Push',muscles:'Pecho, hombros y tríceps'},pull:{name:'Pull',muscles:'Espalda y bíceps'},legs:{name:'Piernas',muscles:'Cuádriceps, isquios y glúteos'},recovery:{name:'Descanso',muscles:'Un día para recuperarte'}};
  const ICONS={arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="m14 6-6 6 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',home:'<path d="M5 7v10M2 9v6M19 7v10M22 9v6M5 12h14"/>',history:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h1m4 0h1"/>',progress:'<path d="M4 4v16h16M8 14l4-5 4 3 4-7"/>',pause:'<path d="M9 5v14m6-14v14"/>',play:'<path d="m9 5 10 7-10 7Z"/>'};
  const icon=name=>'<svg class="'+(name==='arrow'?'arrow':'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[name]+'</svg>';
  const view=document.getElementById('view');
  let state={sessions:[]},draft=null,page='home',selectedType=null,selectedKey=null,metric='weight',timerInterval=null,toastTimeout=null,saving=false,cloudBusy=false,cloudLoaded=false;
  let pending=[];
  let historyMode='calendar',calendarDate=new Date(new Date().getFullYear(),new Date().getMonth(),1),detailReturnDate=null;
  function escapeText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function dateObject(date){return new Date(String(date).slice(0,10)+'T12:00:00');}
  function dateLabel(date,options={day:'numeric',month:'short'}){const d=dateObject(date);return Number.isNaN(d.getTime())?'Fecha sin registrar':d.toLocaleDateString('es',options);}
  function workoutLabel(key,type){if(key==='recovery'||type==='recovery')return 'Descanso';const w=WORKOUTS[key];return w?`${TYPE[w.type].name} · ${w.variant==='heavy'?'Fuerza':'Volumen'}`:(TYPE[type]?.name||'Entrenamiento');}
  function readStored(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback;}catch{return fallback;}}
  function normalizeSession(s){if(!s||typeof s!=='object'||!/^\d{4}-\d{2}-\d{2}/.test(String(s.date)))return null;const out={...s,date:String(s.date).slice(0,10)};for(const k of ['pullups','bodyWeight','squat','bench','deadlift','ts','durationSeconds']){out[k]=s[k]!==null&&s[k]!==undefined&&s[k]!==''&&Number.isFinite(Number(s[k]))?Number(s[k]):null;}return out;}
  function sessionKey(s){return String(s.date)+'|'+(s.workoutKey||s.type||'');}
  function mergeSessions(existing,incoming){const map=new Map(existing.map(s=>[sessionKey(s),s]));for(const item of incoming){const s=normalizeSession(item);if(!s)continue;const key=sessionKey(s),old=map.get(key);if(!old)map.set(key,s);else{const newer=(s.ts||0)>(old.ts||0);const result=newer?{...old,...s}:{...s,...old};if(!Array.isArray(result.sets)||!result.sets.length)result.sets=Array.isArray(old.sets)&&old.sets.length?old.sets:s.sets;map.set(key,result);}}return [...map.values()].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));}
  function storeState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true;}catch{notify('No se pudo guardar en este dispositivo. Exporta el historial para conservarlo.');return false;}}
  function saveDraft(){try{if(draft)localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));else localStorage.removeItem(DRAFT_KEY);}catch{notify('No se pudo guardar el avance en este dispositivo.');}}
  function notify(text){clearTimeout(toastTimeout);const el=document.getElementById('feedback');el.textContent=text;el.hidden=false;toastTimeout=setTimeout(()=>el.hidden=true,4500);}
  function frame(name,html,focus=true){page=name;document.documentElement.dataset.screen=name;view.innerHTML=html;document.getElementById('top-action').hidden=!['exercise','rest','summary','overview','variant','detail','day'].includes(name);document.getElementById('nav').hidden=['exercise','rest','summary','overview','variant'].includes(name);for(const id of ['home','history','progress']){const el=document.getElementById('nav-'+id);el.classList.toggle('active',name===id||(['detail','day'].includes(name)&&id==='history'));if(name===id||(['detail','day'].includes(name)&&id==='history'))el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');}if(focus){window.scrollTo(0,0);const heading=view.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}}
  function back(action='home'){return `<button class="back" data-action="${action}">${icon('back')}Volver</button>`;}
  function showHome(){stopTick();selectedType=null;selectedKey=null;const today=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});if(draft&&WORKOUTS[draft.key]){const completed=draft.logs.filter(x=>!x.skipped).length;frame('home',`<p class="eyebrow">Tu sesión en curso</p><h1>${escapeText(workoutLabel(draft.key))}</h1><p class="lead">${completed} de ${draft.queue.length} series registradas. Continúa donde te quedaste.</p><div class="actions"><button class="primary" data-action="resume">Continuar entrenamiento ${icon('arrow')}</button><button class="text-button" data-action="change-workout">Elegir otra rutina</button></div>`);return;}frame('home',`<p class="eyebrow">${escapeText(today)}</p><h1>¿Qué vas a<br>entrenar hoy?</h1><p class="lead">Elige tu rutina. Vamos una serie a la vez.</p><div class="choices">${Object.entries(TYPE).map(([key,t],i)=>`<button class="choice" data-action="type" data-value="${key}"><span class="choice-index">${key==='recovery'?recoverySticker():`0${i+1}`}</span><span class="choice-body"><span class="choice-title">${t.name}</span><span class="choice-desc">${t.muscles}</span></span>${icon('arrow')}</button>`).join('')}</div>`);}
  function recoverySticker(){return '<svg class="sticker recovery-sticker" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="#e3e9e4" stroke="#a1b6a5"/><path d="M21 8a10 10 0 1 0 7 16A11 11 0 0 1 21 8Z" fill="#536852"/></svg>';}
  function showRecovery(){stopTick();frame('recovery',`${back()}<p class="eyebrow">Tu rutina de hoy</p><h1>Descanso.</h1><p class="lead">Recuperarte también es parte de tu rutina.</p><div class="field"><label for="recovery-date">Día de descanso</label><div class="input-wrap"><input id="recovery-date" type="date" required max="${localDate()}" value="${localDate()}"/></div></div><p class="small" style="margin-top:18px">Quedará marcado con una luna en tu calendario.</p><div class="actions"><button class="primary" data-action="save-recovery">Registrar descanso ${icon('check')}</button></div>`);}
  function saveRecovery(){const field=document.getElementById('recovery-date');if(!field.reportValidity())return;const date=field.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>localDate())return;const session={date,type:'recovery',workoutKey:'recovery',pullups:null,bodyWeight:null,squat:null,bench:null,deadlift:null,feeling:'',isMakeup:false,ts:Date.now(),durationSeconds:0,sets:[]};const previous=state.sessions;state.sessions=mergeSessions(state.sessions,[session]);if(!storeState()){state.sessions=previous;return;}pending=pending.filter(s=>sessionKey(s)!==sessionKey(session));pending.push(session);try{localStorage.setItem(SYNC_KEY,JSON.stringify(pending));}catch{}calendarDate=new Date(dateObject(date).getFullYear(),dateObject(date).getMonth(),1);frame('saved',`<div class="earned-sticker">${recoverySticker()}</div><p class="eyebrow">${escapeText(dateLabel(date))}</p><h1>Descanso<br>registrado.</h1><p class="lead">Tu día de recuperación quedó en el calendario.</p><div class="actions"><button class="primary" data-action="history">Ver mi calendario ${icon('arrow')}</button><button class="text-button" data-action="home">Volver al inicio</button></div>`);syncSession(session);}
  function showVariant(type){if(type==='recovery')return showRecovery();selectedType=type;frame('variant',`${back()}<p class="eyebrow">${TYPE[type].name}</p><h1>¿Cómo quieres<br>entrenar?</h1><div class="choices">${['heavy','volume'].map(v=>{const key=type+'_'+v,w=WORKOUTS[key];return `<button class="choice" data-action="variant" data-value="${key}"><span class="choice-body"><span class="choice-title">${v==='heavy'?'Fuerza':'Volumen'}</span><span class="choice-desc">${v==='heavy'?'Series con menos repeticiones.':'Series con más repeticiones.'} ${w.exercises.length} ejercicios.</span></span>${icon('arrow')}</button>`;}).join('')}</div>`);}
  function cleanName(name){return name.replace(/^[AB][12]\s*·\s*/,'').replace(/^DOMINADAS SIN ASISTENCIA$/,'Dominadas sin asistencia');}
  function exerciseSketchKey(ex){
    const name=cleanName(ex.name).toLowerCase();
    if(name.includes('tabata')){
      if((ex.note||'').includes('V-ups'))return 'vup';
      if((ex.note||'').includes('Mountain climbers'))return 'climber';
      if((ex.note||'').includes('Plank hombros'))return 'plank';
      return 'abwheel';
    }
    const rules=[
      [/press banca/,'bench'],[/press inclinado/,'incline'],[/press declinado/,'decline'],
      [/press militar/,'overhead'],[/elevaciones laterales cable/,'lateral_cable'],
      [/elevaciones laterales mancuerna/,'lateral_dumbbell'],[/fondos/,'dip'],
      [/pushdown/,'pushdown'],[/cruces cable/,'cable_fly'],[/press arnold/,'arnold'],
      [/extensión tríceps sobre cabeza/,'overhead_cable'],[/kickbacks/,'kickback'],
      [/dominadas/,'pullup'],[/peso muerto convencional/,'deadlift'],[/remo pendlay/,'row_bar'],
      [/remo unilateral/,'row_single'],[/face pulls/,'facepull'],[/curl barra/,'curl_bar'],
      [/curl inclinado/,'curl_incline'],[/jalón al pecho/,'lat_pulldown'],[/remo polea baja/,'seated_row'],
      [/pull-over/,'pullover'],[/elevaciones posteriores/,'rear_fly'],[/curl predicador/,'preacher'],
      [/sentadilla back/,'squat'],[/romanian/,'rdl'],[/prensa de piernas/,'leg_press'],
      [/sentadilla búlgara/,'split_squat'],[/curl femoral acostado/,'lying_curl'],
      [/pantorrilla de pie/,'calf'],[/pantorrilla unilateral/,'calf_single'],[/hip thrust/,'hip_thrust'],
      [/extensión cuádriceps/,'knee_extension'],[/curl femoral sentado/,'seated_curl'],
      [/step-ups/,'stepup'],[/bici/,'bike'],[/boxeo/,'boxing'],[/running|zona 2/,'running']
    ];
    return rules.find(([test])=>test.test(name))?.[1]||null;
  }
  function exerciseSketch(ex){
    const key=exerciseSketchKey(ex);if(!key)return '';
    const label=escapeText('Ilustración de '+cleanName(ex.name));
    return `<figure class="exercise-sketch"><img src="assets/exercises/${key}.webp" width="128" height="106" alt="${label}" decoding="async"></figure>`;
  }
  function showOverview(key){selectedKey=key;const w=WORKOUTS[key];frame('overview',`${back('back-variant')}<p class="eyebrow">Tu entrenamiento</p><h1>${TYPE[w.type].name}<br>${w.variant==='heavy'?'Fuerza':'Volumen'}</h1><p class="lead">${TYPE[w.type].muscles}.</p><div class="meta-line"><span>${w.exercises.length} ejercicios</span><span>${escapeText(w.duration.replace('~','Aprox. '))}</span></div><div class="next-exercise"><p class="small">Empiezas con</p><p class="routine-name">${escapeText(cleanName(w.exercises[0].name))}</p></div><div class="actions"><button class="primary" data-action="start">Empezar entrenamiento ${icon('arrow')}</button></div>`);}
  function restSeconds(text){const m=text.match(/(\d+(?:\.\d+)?)\s*(min|seg)/);return m?Math.round(Number(m[1])*(m[2]==='min'?60:1)):0;}
  function setTotal(ex){const m=ex.sets.match(/^(\d+)×/);return m?Number(m[1]):1;}
  function isTimed(ex){return !/^\d+×/.test(ex.sets);}
  function buildQueue(w){const q=[];for(let i=0;i<w.exercises.length;i++){const ex=w.exercises[i],pair=/^[AB]1\s*·/.test(ex.name)&&new RegExp('^'+ex.name[0]+'2\\s*·').test(w.exercises[i+1]?.name||'');if(pair){const next=w.exercises[i+1],rounds=Math.max(setTotal(ex),setTotal(next));for(let s=1;s<=rounds;s++){if(s<=setTotal(ex))q.push({exIndex:i,set:s,total:setTotal(ex),rest:0});if(s<=setTotal(next))q.push({exIndex:i+1,set:s,total:setTotal(next),rest:restSeconds(next.rest)});}i++;}else for(let s=1;s<=setTotal(ex);s++)q.push({exIndex:i,set:s,total:setTotal(ex),rest:restSeconds(ex.rest)});}return q;}
  function startWorkout(){if(!WORKOUTS[selectedKey])return;draft={key:selectedKey,queue:buildQueue(WORKOUTS[selectedKey]),cursor:0,logs:[],startedAt:Date.now(),date:localDate(),phase:'exercise',bodyWeight:'',feeling:'',restEndsAt:null,restRemaining:null,restPaused:false};saveDraft();showExercise();}

  const METRICS={weight:{label:'Peso corporal',key:'bodyWeight',unit:'lb'},pullups:{label:'Dominadas',key:'pullups',unit:'reps'},bench:{label:'Press banca',key:'bench',unit:'lb'},squat:{label:'Sentadilla',key:'squat',unit:'lb'},deadlift:{label:'Peso muerto',key:'deadlift',unit:'lb'}};
  function showProgress(){stopTick();const m=METRICS[metric],data=state.sessions.filter(s=>s[m.key]!==null&&s[m.key]!==undefined&&Number.isFinite(Number(s[m.key]))).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0)),latest=data.at(-1);frame('progress',`<p class="eyebrow">Tus registros, a tu ritmo</p><h1>Progreso.</h1><label class="small" for="metric">Qué quieres ver</label><select id="metric" class="view-select">${Object.entries(METRICS).map(([key,m])=>`<option value="${key}" ${metric===key?'selected':''}>${m.label}</option>`).join('')}</select>${latest?`<p class="small">Último registro · ${escapeText(dateLabel(latest.date))}</p><div class="metric-number">${Number(latest[m.key])}<span>${m.unit}</span></div>${makeChart(data,m)}<div class="chart-note"><span>${escapeText(dateLabel(data[0].date))}</span><span>${data.length} ${data.length===1?'registro':'registros'}</span><span>${escapeText(dateLabel(latest.date))}</span></div><div class="records-list">${data.slice(-6).reverse().map(s=>`<div class="records-row"><span>${escapeText(dateLabel(s.date))}</span><strong>${Number(s[m.key])} ${m.unit}</strong></div>`).join('')}</div>`:`<div class="empty">${icon('progress')}<h2>Aún no hay registros<br>de ${m.label.toLowerCase()}.</h2><p>${metric==='weight'?'Puedes añadir tu peso al guardar una sesión.':'Registra las series de este ejercicio para ver su evolución.'}</p><button class="secondary" data-action="home">Ir a entrenar</button></div>`}`);}
  function makeChart(data,m){const values=data.map(s=>Number(s[m.key])),min=Math.min(...values),max=Math.max(...values),pad=Math.max((max-min)*.2,max===min?Math.max(1,Math.abs(max)*.025):.5),lo=min-pad,hi=max+pad;const times=data.map(s=>dateObject(s.date).getTime()),first=times[0],last=times.at(-1),sameDate=first===last;const yOf=v=>310-(v-lo)/(hi-lo)*270;const coords=values.map((v,i)=>({x:data.length===1?270:sameDate?70+i/(data.length-1)*400:70+(times[i]-first)/(last-first)*400,y:yOf(v),v}));return `<svg class="chart" viewBox="0 0 490 350" role="img" aria-label="${m.label}: ${values.join(', ')} ${m.unit}, de más antiguo a más reciente"><title>${m.label}: evolución de los registros</title><text x="0" y="18">${m.unit}</text>${Array.from({length:5},(_,i)=>lo+(hi-lo)*i/4).map(v=>{const y=yOf(v);return `<line x1="70" x2="477" y1="${y}" y2="${y}"/><text x="58" text-anchor="end" y="${y+5}">${v.toFixed(metric==='pullups'?0:1)}</text>`;}).join('')}<polyline points="${coords.map(p=>p.x+','+p.y).join(' ')}"/>${coords.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5"><title>${escapeText(dateLabel(data[i].date))}: ${p.v} ${m.unit}</title></circle>`).join('')}</svg>`;}
  async function fetchCloud(url){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);return await response.json();}finally{clearTimeout(timeout);}}
  async function syncSession(session){try{const json=await fetchCloud(`${SCRIPT_URL}?type=gym&action=save&data=${encodeURIComponent(JSON.stringify(session))}`);if(json.status!=='ok'&&json.success!==true)throw new Error('Save not confirmed');pending=pending.filter(s=>sessionKey(s)!==sessionKey(session)||s.ts!==session.ts);try{localStorage.setItem(SYNC_KEY,JSON.stringify(pending));}catch{}return true;}catch{return false;}}
  async function syncCloud(){if(cloudBusy)return;cloudBusy=true;const btn=document.getElementById('sync-button');if(btn){btn.disabled=true;btn.textContent='Recuperando sesiones…';}let failed=false;for(const s of pending.slice()){if(!await syncSession(s))failed=true;}try{const json=await fetchCloud(`${SCRIPT_URL}?type=gym`);if(json.status!=='ok'||!Array.isArray(json.sessions))throw new Error('Invalid history');state.sessions=mergeSessions(state.sessions,json.sessions);cloudLoaded=true;storeState();if(page==='history')showHistory();notify(failed?'Historial recuperado. Algunas sesiones siguen pendientes de sincronizar.':'Historial actualizado.');}catch{notify('No se pudo conectar. Tus sesiones guardadas en este dispositivo siguen disponibles.');if(btn){btn.disabled=false;btn.textContent='Volver a intentar';}}finally{cloudBusy=false;}}
  async function loadCloudHistory(){try{const json=await fetchCloud(`${SCRIPT_URL}?type=gym`);if(json.status==='ok'&&Array.isArray(json.sessions)){state.sessions=mergeSessions(state.sessions,json.sessions);cloudLoaded=true;storeState();if(page==='history')showHistory();if(page==='progress')showProgress();}}catch{}}
  function exportHistory(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='entreno-historial-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  async function importHistory(file){if(!file)return;try{if(file.size>10000000)throw new Error();const json=JSON.parse(await file.text()),items=Array.isArray(json)?json:json.sessions;if(!Array.isArray(items)||!items.length||items.some(s=>!normalizeSession(s)))throw new Error();state.sessions=mergeSessions(state.sessions,items);if(storeState()){showHistory();notify('Historial importado.');}}catch{notify('Elige un archivo JSON de historial válido.');}document.getElementById('import-file').value='';}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const value=el.dataset.value;switch(el.dataset.action){case'home':showHome();break;case'type':showVariant(value);break;case'variant':showOverview(value);break;case'back-variant':showVariant(selectedType);break;case'save-recovery':saveRecovery();break;case'start':startWorkout();break;case'resume':resume();break;case'change-workout':if(window.confirm('¿Dejar la sesión en curso y elegir otra rutina? Las series de esta sesión todavía no están en el historial.')){draft=null;saveDraft();showHome();}break;case'complete':completeStep();break;case'skip':completeStep(true);break;case'finish-early':showSummary();break;case'next':showExercise();break;case'adjust-rest':adjustRest(Number(value));break;case'pause-rest':pauseRest();break;case'feeling':draft.feeling=draft.feeling===value?'':value;saveDraft();view.querySelectorAll('.feeling-option').forEach(b=>{const selected=b.dataset.value===draft.feeling;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});break;case'save':saveSession();break;case'return-exercise':showExercise();break;case'history':showHistory();break;case'progress':showProgress();break;case'detail':detailReturnDate=el.dataset.date||null;showDetail(el.dataset.key?state.sessions.findIndex(s=>sessionKey(s)===el.dataset.key):Number(value));break;case'history-mode':historyMode=value==='list'?'list':'calendar';showHistory(false);document.getElementById('history-'+historyMode).focus();break;case'calendar-month':changeCalendarMonth(Number(value));break;case'calendar-today':calendarDate=new Date(new Date().getFullYear(),new Date().getMonth(),1);showHistory();break;case'calendar-day':showCalendarDay(value);break;case'back-calendar':historyMode='calendar';showHistory();break;case'back-day':showCalendarDay(detailReturnDate);break;case'export':exportHistory();break;case'import':document.getElementById('import-file').click();break;case'sync':syncCloud();break;case'tip':{const tip=document.getElementById('technique-tip');tip.hidden=!tip.hidden;el.setAttribute('aria-expanded',String(!tip.hidden));el.textContent=tip.hidden?'Ver indicaciones':'Ocultar indicaciones';break;}}});
  document.addEventListener('change',event=>{if(event.target.id==='metric'){metric=event.target.value;showProgress();}if(event.target.id==='import-file')importHistory(event.target.files[0]);});
  document.addEventListener('input',event=>{if(event.target.id==='body-weight'&&draft){draft.bodyWeight=event.target.value;saveDraft();}});
  document.addEventListener('submit',event=>{if(event.target.id==='set-form'){event.preventDefault();completeStep();}if(event.target.id==='summary-form'){event.preventDefault();saveSession();}});
  function init(){const stored=readStored(STORAGE_KEY,{sessions:[]});state={...stored,sessions:mergeSessions([],Array.isArray(stored.sessions)?stored.sessions:[])};pending=readStored(SYNC_KEY,[]);if(!Array.isArray(pending))pending=[];draft=readStored(DRAFT_KEY,null);if(draft&&(!WORKOUTS[draft.key]||!Array.isArray(draft.queue)||!Array.isArray(draft.logs)||!Number.isInteger(draft.cursor)))draft=null;for(const id of ['home','history','progress'])document.getElementById('nav-'+id).innerHTML=icon(id)+({home:'Entrenar',history:'Historial',progress:'Progreso'}[id]);showHome();}
  init();
  loadCloudHistory();
</script>
</body>
